[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "How harness changes move a fixed agent's score."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "plotly>=5.20",
    "kaleido>=1.0",
    "pytest>=7.4",
    "nbconvert>=7.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
